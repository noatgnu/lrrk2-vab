<header class="topbar">
  <h1>LRRK2 Variant Activity Browser</h1>
  <nav class="views">
    @for (view of views; track view.path) {
      <a [routerLink]="['/', data.requested(), view.path]" routerLinkActive="active">{{
        view.label
      }}</a>
    }
  </nav>
  <app-version-picker class="version" />
  <app-theme-toggle />
</header>

<main class="content">
  <app-breadcrumbs />
  <router-outlet />
</main>
