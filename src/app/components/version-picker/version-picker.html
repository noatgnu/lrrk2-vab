@if (data.index(); as index) {
  <label class="picker" [title]="data.current()?.source ?? ''">
    <span>Data</span>
    <select (change)="choose($any($event.target).value)">
      <option [value]="latest" [selected]="data.requested() === latest">
        Latest ({{ index.latest }})
      </option>
      @for (version of index.versions; track version.id) {
        <option [value]="version.id" [selected]="data.requested() === version.id">
          {{ version.id }}{{ version.label ? ' · ' + version.label : '' }}
        </option>
      }
    </select>
  </label>
} @else if (data.indexFailed()) {
  <span class="error">Data index unavailable</span>
}
