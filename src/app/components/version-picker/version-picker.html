@if (data.index(); as index) {
  <label class="picker" [title]="data.current()?.source ?? ''">
    <span>Data</span>
    <select (change)="choose($any($event.target).value)">
      <option [value]="latest" [selected]="data.requested() === latest" [title]="index.latest">
        Latest ({{ latestVersion() ? name(latestVersion()!) : index.latest }})
      </option>
      @for (version of listed(); track version.id) {
        <option
          [value]="version.id"
          [selected]="data.requested() === version.id"
          [title]="version.id"
        >
          {{ name(version) }}{{ version.published ? ' · published' : '' }}
        </option>
      }
    </select>
  </label>
} @else if (data.indexFailed()) {
  <span class="error">Data index unavailable</span>
}
