<div class="chip" role="status" aria-live="polite">
  <span class="swatch" [style.background]="palette().domain[domain().name]"></span>
  <span class="label">Focused domain</span>
  <strong class="name">{{ domain().name }}</strong>
  <span class="detail">
    {{ domain().start }}–{{ domain().end }} · {{ variantCount() }} variant{{
      variantCount() === 1 ? '' : 's'
    }}
  </span>
  <button
    type="button"
    class="clear"
    aria-label="Clear domain focus"
    title="Clear domain focus"
    (click)="cleared.emit()"
  >
    <span class="material-symbols-outlined" aria-hidden="true">close</span>
  </button>
</div>
